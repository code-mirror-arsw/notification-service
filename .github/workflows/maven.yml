name: Deploy Notification Service to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_ONE_HOST }}
          username: ${{ secrets.SERVER_ONE_USER }}
          password: ${{ secrets.SERVER_ONE_PASSWORD }}
          source: target/notification-service-0.0.1-SNAPSHOT.jar
          target: /opt/notificationService/

      - name: Restart Notification Service
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_ONE_HOST }}
          username: ${{ secrets.SERVER_ONE_USER }}
          password: ${{ secrets.SERVER_ONE_PASSWORD }}
          script: |
            echo "🛑 Killing process on port 8085..."
            fuser -k 8085/tcp || true

            echo "🧹 Removing previous .jar..."
            rm -f /opt/notificationService/notification-service-0.0.1-SNAPSHOT.jar

            echo "📦 Moving new JAR..."
            mv /opt/notificationService/target/notification-service-0.0.1-SNAPSHOT.jar /opt/notificationService/notification-service-0.0.1-SNAPSHOT.jar

            echo "📂 Ensuring log directory exists..."
            mkdir -p /home/${USER}/logs

            echo "🚀 Starting Notification Service..."
            nohup java -jar /opt/notificationService/notification-service-0.0.1-SNAPSHOT.jar > /home/${USER}/logs/notification.log 2>&1 &

            echo "📄 Showing last 50 lines of log..."
            sleep 5
            tail -n 50 /home/${USER}/logs/notification.log
